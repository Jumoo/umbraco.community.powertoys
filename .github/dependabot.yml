version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Umbraco.*"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /src/PowerToys/Client
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@umbraco-cms/*"
      # TypeScript is pinned to v5 until hey-api supports v7.
      - dependency-name: "typescript"
        versions: [">=6"]
      # hey-api generates the API client; 0.x minors are breaking, so upgrade by hand.
      - dependency-name: "@hey-api/*"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
