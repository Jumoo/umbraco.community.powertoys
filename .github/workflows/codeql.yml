name: "CodeQL"

# Disabled until Advanced Security is enabled for this repository (required for code scanning
# on a private/community repo). Trigger manually via workflow_dispatch until then; re-enable
# the push/pull_request/schedule triggers below once it is.
on:
  workflow_dispatch:
  # push:
  #   branches: ["v17/main"]
  # pull_request:
  #   branches: ["v17/main"]
  # schedule:
  #   - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      matrix:
        language: [actions, csharp, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
