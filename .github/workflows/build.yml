name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/PowerToys/Client/package-lock.json

      - name: Build client
        working-directory: src/PowerToys/Client
        run: |
          npm ci
          npm run build

      - name: Build solution
        run: dotnet build src/PowerToys.slnx -c Release
